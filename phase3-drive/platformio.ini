[platformio]
; 專案自訂板型（JK2501 綠板）
boards_dir = ../boards

; Phase 3：遙控器低速驅動（設計：DESIGN.md）。沿用 Phase 2 的函式庫（../phase2-modbus/lib）。
; 本階段 native 以外的環境只做編譯驗證；不得執行 upload 與 monitor（需使用者明確同意，規則 10、11）。
; dryrun／live 需要 -DTHROTTLE_CH=<n> -DARM_CH=<n>（由使用者指定，見 src/config.h）；live 另需 -DFAILSAFE_VERIFIED=1。
; dryrun 與 live 都帶通道旗標；live 另帶 FAILSAFE_VERIFIED=1（使用者於 2026-11-23 聲明 T2 (a)(b) 已在 dryrun 通過後指定）。燒錄 live 仍須使用者另行明確確認。

[env:native]
; 電腦端單元測試，live 語意（沒有 DRIVE_DRYRUN）。
platform = native
test_framework = unity
lib_extra_dirs = ../phase2-modbus/lib
build_flags =
    -std=gnu++17
    -O0
    -g
    -Wall
    -Wextra
    --coverage
    -lgcov
    -I../phase2-modbus/test/test_native

[env:native_dryrun]
; 電腦端單元測試，dryrun 語意（DRIVE_DRYRUN）。
platform = native
test_framework = unity
lib_extra_dirs = ../phase2-modbus/lib
build_flags =
    -std=gnu++17
    -O0
    -g
    -Wall
    -Wextra
    --coverage
    -lgcov
    -I../phase2-modbus/test/test_native
    -DDRIVE_DRYRUN

[env:dryrun]
; 乾跑：寫入只印出，不編譯任何寫入傳輸（沒有 DRIVE_LIVE）；讀取走真實唯讀 transport。
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = log2file
lib_deps = bmellink/IBusBM@1.1.4
lib_extra_dirs = ../phase2-modbus/lib
build_flags =
    -DDRIVE_DRYRUN
    ; 通道由使用者指定（2026-11-23，0 起算）：油門 CH2（左桿上下，回中 1500）、SWA CH7（解鎖 2000／關閉 1000）
    -DTHROTTLE_CH=1
    -DARM_CH=6
    -DSTEER_CH=3
build_src_filter = -<*> +<drive_main.cpp>

[env:live]
; 正式：啟用寫入傳輸。須使用者另外明確確認才可燒錄。
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = log2file
lib_deps = bmellink/IBusBM@1.1.4
lib_extra_dirs = ../phase2-modbus/lib
build_flags =
    -DDRIVE_LIVE
    ; 使用者指定（2026-11-23）：通道與 dryrun 相同（油門 CH2、SWA CH7）；T2 (a)(b) 已在 dryrun 通過，使用者聲明並指定 FAILSAFE_VERIFIED=1
    -DTHROTTLE_CH=1
    -DARM_CH=6
    -DSTEER_CH=3
    -DFAILSAFE_VERIFIED=1
build_src_filter = -<*> +<drive_main.cpp>

; ---- JK2501 綠板（ESP32-S3-WROOM-1-N16R8）：phase3 移植（使用者授權 2026-11-25；設計見 DESIGN.md §12） ----
; 腳位沿用 s3_ibus／s3_poll 實測通過的設定：i-BUS RX=GPIO18（排針側，X6 空著）、RS485 RX=GPIO15、TX=GPIO16（無 DE/RE）。
; 通道沿用使用者指定（2026-11-23，同一組遙控器與接收器）：油門 CH2、SWA CH7、轉向 CH4。
; DRIVE_STRICT_SAFETY：(a) 解鎖前重寫 2000h 並讀回；(b) 開機先送停止並讀回 20A2h；(c) 通道值超出 1000–2000 → 解除／不解鎖。
; 燒錄由使用者操作，須另行確認（規則 10、13）。
[env:s3_drive_dry]
; 乾跑：寫入只印出，沒有寫入傳輸（沒有 DRIVE_LIVE）。
platform = espressif32@6.10.0
board = jk2501_n16r8
framework = arduino
monitor_speed = 115200
monitor_filters = log2file
lib_deps = bmellink/IBusBM@1.1.4
lib_extra_dirs = ../phase2-modbus/lib
build_flags =
    -DDRIVE_DRYRUN
    -DTHROTTLE_CH=1
    -DARM_CH=6
    -DSTEER_CH=3
    -DIBUS_RX_PIN=18
    -DRS485_RX_PIN=15
    -DRS485_TX_PIN=16
    -DMODBUS_MAX_ATTEMPTS=1
    -DDRIVE_STRICT_SAFETY=1
build_src_filter = -<*> +<drive_main.cpp>

[env:s3_drive_live]
; 正式：啟用寫入傳輸（使用者 2026-11-25 明確要求，規則 14）。
; 刻意沒有 FAILSAFE_VERIFIED：是否寫入本環境由使用者決定（docs/CI.md 待決項 (d)）。未決定前 src/config.h 會讓編譯失敗。
platform = espressif32@6.10.0
board = jk2501_n16r8
framework = arduino
monitor_speed = 115200
monitor_filters = log2file
lib_deps = bmellink/IBusBM@1.1.4
lib_extra_dirs = ../phase2-modbus/lib
build_flags =
    -DDRIVE_LIVE
    -DTHROTTLE_CH=1
    -DARM_CH=6
    -DSTEER_CH=3
    -DIBUS_RX_PIN=18
    -DRS485_RX_PIN=15
    -DRS485_TX_PIN=16
    -DMODBUS_MAX_ATTEMPTS=1
    -DDRIVE_STRICT_SAFETY=1
build_src_filter = -<*> +<drive_main.cpp>
