; Phase 3：遙控器低速驅動（設計：DESIGN.md）。沿用 Phase 2 的函式庫（../phase2-modbus/lib）。
; 本階段 native 以外的環境只做編譯驗證；不得執行 upload 與 monitor（需使用者明確同意，規則 10、11）。
; dryrun／live 需要 -DTHROTTLE_CH=<n> -DARM_CH=<n>（由使用者指定，見 src/config.h）；live 另需 -DFAILSAFE_VERIFIED=1。
; dryrun 與 live 都帶通道旗標；live 另帶 FAILSAFE_VERIFIED=1（使用者於 2026-11-23 聲明 T2 (a)(b) 已在 dryrun 通過後指定）。燒錄 live 仍須使用者另行明確確認。

[env:native]
; 電腦端單元測試，live 語意（沒有 DRIVE_DRYRUN）。
platform = native
test_framework = unity
lib_extra_dirs = ../phase2-modbus/lib
build_flags =
    -std=gnu++17
    -O0
    -g
    -Wall
    -Wextra
    --coverage
    -lgcov
    -I../phase2-modbus/test/test_native

[env:native_dryrun]
; 電腦端單元測試，dryrun 語意（DRIVE_DRYRUN）。
platform = native
test_framework = unity
lib_extra_dirs = ../phase2-modbus/lib
build_flags =
    -std=gnu++17
    -O0
    -g
    -Wall
    -Wextra
    --coverage
    -lgcov
    -I../phase2-modbus/test/test_native
    -DDRIVE_DRYRUN

[env:dryrun]
; 乾跑：寫入只印出，不編譯任何寫入傳輸（沒有 DRIVE_LIVE）；讀取走真實唯讀 transport。
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = log2file
lib_deps = bmellink/IBusBM@1.1.4
lib_extra_dirs = ../phase2-modbus/lib
build_flags =
    -DDRIVE_DRYRUN
    ; 通道由使用者指定（2026-11-23，0 起算）：油門 CH2（左桿上下，回中 1500）、SWA CH7（解鎖 2000／關閉 1000）
    -DTHROTTLE_CH=1
    -DARM_CH=6
build_src_filter = -<*> +<drive_main.cpp>

[env:live]
; 正式：啟用寫入傳輸。須使用者另外明確確認才可燒錄。
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = log2file
lib_deps = bmellink/IBusBM@1.1.4
lib_extra_dirs = ../phase2-modbus/lib
build_flags =
    -DDRIVE_LIVE
    ; 使用者指定（2026-11-23）：通道與 dryrun 相同（油門 CH2、SWA CH7）；T2 (a)(b) 已在 dryrun 通過，使用者聲明並指定 FAILSAFE_VERIFIED=1
    -DTHROTTLE_CH=1
    -DARM_CH=6
    -DFAILSAFE_VERIFIED=1
build_src_filter = -<*> +<drive_main.cpp>
