[platformio]
; 專案自訂板型（JK2501 綠板）
boards_dir = ../boards

; Phase 2：Modbus RTU 唯讀通訊
; 目前只有 native（電腦端單元測試）環境；真實 transport 與 main 經使用者確認後才加入。
; 不得在此加入 upload／monitor 相關設定。
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -O0
    -g
    -Wall
    -Wextra
    --coverage
    -lgcov

; ---- ESP32 環境（只編譯；本階段不執行 upload 與 monitor，需使用者明確同意） ----
; A5：迴路測試。模組拆下，GPIO16 與 GPIO17 短接。
[env:loopback]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<loopback_main.cpp>

; A6：輪詢主程式。只讀 FC 0x03。
[env:main]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<poll_main.cpp>

; ---- JK2501 綠板（ESP32-S3-WROOM-1-N16R8）只讀環境（Issue #8；只編譯，燒錄由使用者操作） ----
; 板型定義在 ../boards/jk2501_n16r8.json（16 MB QIO flash、OPI PSRAM；GPIO35–37 被 PSRAM 佔用，不得使用）。
; 只用 FC 0x03；不定義 DRIVE_LIVE／DRIVE_DRYRUN，不連結 phase3 的寫入程式（test_static.cpp 檢查）。
; RS485：RX=GPIO15、TX=GPIO16，沒有 DE/RE 腳。出錯只記錄、不重送（MODBUS_MAX_ATTEMPTS=1）。
[env:s3_poll]
platform = espressif32@6.10.0
board = jk2501_n16r8
framework = arduino
monitor_speed = 115200
build_flags =
    -DRS485_RX_PIN=15
    -DRS485_TX_PIN=16
    -DMODBUS_MAX_ATTEMPTS=1
build_src_filter = -<*> +<s3_poll_main.cpp>
