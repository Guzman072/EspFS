; Phase 2：Modbus RTU 唯讀通訊
; 目前只有 native（電腦端單元測試）環境；真實 transport 與 main 經使用者確認後才加入。
; 不得在此加入 upload／monitor 相關設定。
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -O0
    -g
    -Wall
    -Wextra
    --coverage
    -lgcov

; ---- ESP32 環境（只編譯；本階段不執行 upload 與 monitor，需使用者明確同意） ----
; A5：迴路測試。模組拆下，GPIO16 與 GPIO17 短接。
[env:loopback]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<loopback_main.cpp>

; A6：輪詢主程式。只讀 FC 0x03。
[env:main]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<poll_main.cpp>
