[platformio]
; 專案自訂板型（JK2501 綠板）
boards_dir = ../boards

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
lib_deps = bmellink/IBusBM@1.1.4
monitor_speed = 115200

; JK2501 綠板（ESP32-S3-WROOM-1-N16R8）：i-BUS 接排針側 GPIO18（X6 光耦端子必須空著，Issue #8）。
; 只接收 i-BUS 並印出 CH1–CH10；不含任何 Modbus 程式。GPIO35–37 被 OPI PSRAM 佔用，不得使用。
[env:s3_ibus]
platform = espressif32@6.10.0
board = jk2501_n16r8
framework = arduino
lib_deps = bmellink/IBusBM@1.1.4
monitor_speed = 115200
build_flags =
    -DIBUS_RX_PIN=18
